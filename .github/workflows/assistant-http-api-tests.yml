name: Assistant read-only HTTP API tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "assistant/**"
      - "global_markets/**"
      - "tests/assistant_http_api_checks.py"
      - "requirements-api.txt"
      - ".github/workflows/assistant-http-api-tests.yml"

permissions:
  contents: read

jobs:
  assistant-http-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Compile assistant API
        run: python -m py_compile assistant/http_api.py
      - name: Run read-only API tests
        run: python -m unittest discover -s tests -p "assistant_http_api_checks.py" -v
