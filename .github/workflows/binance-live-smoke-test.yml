name: Binance live crypto feed smoke test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binance-live-smoke-test.yml"

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install feed dependency
        run: python -m pip install "requests>=2.31,<3.0"
      - name: Fetch and quality-check live Binance candles
        run: |
          python - <<'PY'
          from global_markets.crypto_feed import CryptoWatchlistFeed
          from global_markets.market_analysis import analyze_feed

          symbols = [
              "BTCUSD", "ETHUSD", "SOLUSD", "LINKUSD", "XLMUSD", "SUIUSD",
              "HYPEUSD", "XMRUSD", "LEOUSD", "BATUSD", "PEPEUSD", "BEAMUSD",
              "ANVLUSD",
          ]
          feed = CryptoWatchlistFeed()
          raw = feed.fetch(symbols=symbols, intervals=("1d", "4h"), limit=200)
          report = analyze_feed(raw)

          print("SOURCE: Binance public spot market data")
          print(f"OBSERVED_AT: {raw['observed_at']}")
          print(f"FEED_SUMMARY: {raw['summary']}")
          print(f"QUALITY_SUMMARY: eligible_series={report['eligible_series']}; rejected_series={report['rejected_series']}")

          for item in report["analyses"]:
              if item["eligible"]:
                  ind = item["indicators"]
                  print(
                      f"FRESH {item['symbol']} {item['interval']}: "
                      f"close={item['latest_close']}; RSI14={ind['rsi_14']}; "
                      f"MACD={ind['macd_12_26']}; MACD_signal={ind['macd_signal_9']}; "
                      f"SMA20={ind['sma_20']}; SMA50={ind['sma_50']}; "
                      f"technical_screen_score={item['technical_screen_score']}; "
                      f"age_seconds={item['age_seconds']}"
                  )
              else:
                  print(
                      f"REJECTED {item.get('symbol')} {item.get('interval')}: "
                      f"bars={item.get('bars')}; reasons={item['reasons']}"
                  )

          for item in report["provider_unavailable"]:
              print(
                  f"UNAVAILABLE {item.get('symbol')}: "
                  f"interval={item.get('interval')}; reason={item.get('reason')}"
              )

          # BTC and ETH must each have at least one fresh interval for a
          # successful real-data quality smoke test.
          fresh_symbols = {item["symbol"] for item in report["analyses"] if item["eligible"]}
          if not {"BTCUSDT", "ETHUSDT"}.issubset(fresh_symbols):
              raise SystemExit("FAIL: BTC and ETH did not both pass live freshness/history checks.")
          print("SUCCESS: live Binance candles fetched and passed freshness/indicator checks for BTC and ETH.")
          PY
