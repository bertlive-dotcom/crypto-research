name: Final breakout robustness validation v2

on:
  schedule:
    - cron: "0 1 * * 0"
  push:
    branches:
      - feature/breakout-final-validation-v2
  workflow_dispatch:
    inputs:
      candle_limit:
        description: "Daily candle history per asset"
        required: true
        default: "10000"
        type: choice
        options:
          - "5000"
          - "7500"
          - "10000"

permissions:
  contents: read

concurrency:
  group: breakout-final-validation-v2
  cancel-in-progress: false

jobs:
  research:
    name: Run equal-stop, ATR-stop and regime validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: feature/breakout-final-validation-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas

      - name: Run full unit test suite
        run: python -m unittest discover -s tests

      - name: Run final validation on public Binance Spot data
        run: |
          PYTHONPATH=. python tools/run_breakout_final_validation_v2.py \
            --limit "${{ inputs.candle_limit || '10000' }}" \
            --output reports/breakout_final_validation_v2.json

      - name: Upload final validation report
        uses: actions/upload-artifact@v4
        with:
          name: breakout-final-validation-v2
          path: reports/breakout_final_validation_v2.json
          if-no-files-found: error
          retention-days: 30
