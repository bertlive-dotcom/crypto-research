name: Manual breakout-retest comparison matrix

on:
  workflow_dispatch:
    inputs:
      candle_limit:
        description: "Historical candles per asset and interval"
        required: true
        default: "5000"
        type: choice
        options:
          - "1000"
          - "2000"
          - "3000"
          - "5000"

permissions:
  contents: read

concurrency:
  group: isolated-breakout-retest-matrix
  cancel-in-progress: false

jobs:
  research:
    name: Run read-only Binance comparison matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: feature/breakout-retest-matrix-research

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Generate comparison matrix from Binance Spot
        run: |
          PYTHONPATH=. python tools/run_breakout_retest_matrix.py \
            --limit "${{ inputs.candle_limit }}" \
            --intervals 4h 1d \
            --output reports/breakout_retest_matrix_latest.json

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: breakout-retest-comparison-matrix
          path: reports/breakout_retest_matrix_latest.json
          if-no-files-found: error
          retention-days: 30
