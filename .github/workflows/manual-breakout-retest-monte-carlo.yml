name: Manual breakout-retest and Monte Carlo research

on:
  workflow_dispatch:
    inputs:
      simulations:
        description: "Monte Carlo paths per segment"
        required: true
        default: "10000"
        type: choice
        options:
          - "10000"
          - "25000"
          - "50000"
      risk_per_trade_pct:
        description: "Fixed-fractional risk assumption (research only)"
        required: true
        default: "1.0"
        type: choice
        options:
          - "0.5"
          - "1.0"
          - "1.5"
      candle_limit:
        description: "Daily candles per asset (paginated history)"
        required: true
        default: "1000"
        type: choice
        options:
          - "1000"
          - "2000"
          - "3000"
          - "5000"

permissions:
  contents: read

concurrency:
  group: isolated-market-research
  cancel-in-progress: false

jobs:
  research:
    name: Fetch Binance Spot data and run isolated research
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependency
        run: python -m pip install --upgrade pip requests

      - name: Generate breakout-retest report from Binance
        run: |
          python tools/run_breakout_retest_research.py \
            --limit "${{ inputs.candle_limit }}" \
            --output reports/breakout_retest_latest.json

      - name: Run Monte Carlo risk research
        run: |
          python tools/run_monte_carlo_research.py \
            --input reports/breakout_retest_latest.json \
            --output reports/monte_carlo/monte_carlo_risk_latest.json \
            --simulations "${{ inputs.simulations }}" \
            --risk-per-trade-pct "${{ inputs.risk_per_trade_pct }}" \
            --block-size 3 \
            --ruin-drawdown-pct 20 \
            --seed 42

      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: breakout-retest-monte-carlo-research
          path: |
            reports/breakout_retest_latest.json
            reports/monte_carlo/monte_carlo_risk_latest.json
          if-no-files-found: error
          retention-days: 30
