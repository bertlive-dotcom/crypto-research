name: Paired breakout-retest final holdout research

on:
  workflow_dispatch:
    inputs:
      candle_limit:
        description: "Daily candle history per asset (Binance pagination; max 10000)"
        required: true
        default: "5000"
        type: choice
        options:
          - "3000"
          - "5000"
          - "7500"
          - "10000"

permissions:
  contents: read

concurrency:
  group: paired-breakout-retest-final-holdout
  cancel-in-progress: false

jobs:
  research:
    name: Run paired comparison and untouched final holdout
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: feature/breakout-retest-paired-final-holdout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas

      - name: Run full unit test suite
        run: python -m unittest discover -s tests

      - name: Run paired research from Binance Spot public candles
        run: |
          PYTHONPATH=. python tools/run_paired_breakout_retest_final_holdout.py \
            --limit "${{ inputs.candle_limit }}" \
            --output reports/paired_breakout_retest_final_holdout.json

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: paired-breakout-retest-final-holdout
          path: reports/paired_breakout_retest_final_holdout.json
          if-no-files-found: error
          retention-days: 30
