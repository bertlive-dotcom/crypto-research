name: Market scanner and trading desk unit tests

on:
  push:
    branches:
      - main
      - feature/ai-crypto-trading-desk-simulation
      - feature/market-scanner-v1
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scanner_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: scanner_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install persistence test dependencies
        run: python -m pip install requests "psycopg[binary]>=3.2,<4"
      - name: Create Supabase-compatible test roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Apply scanner SQL migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/market_scanner_v1.sql
      - name: Run simulation engine tests
        run: python -m unittest discover -s tests -v
