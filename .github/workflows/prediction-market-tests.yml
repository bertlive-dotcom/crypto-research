name: Prediction market intelligence tests

on:
  pull_request:
    paths:
      - "prediction_markets/**"
      - "tests/test_prediction_markets.py"
      - "tests/test_supabase_store.py"
      - "supabase_store.py"
      - "app.py"
      - ".github/workflows/prediction-market-tests.yml"
  push:
    branches:
      - "main"
      - "feature/prediction-market-intelligence-v1"
    paths:
      - "prediction_markets/**"
      - "tests/test_prediction_markets.py"
      - "tests/test_supabase_store.py"
      - "supabase_store.py"
      - "app.py"
      - ".github/workflows/prediction-market-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install "requests>=2.31,<3.0"
      - name: Compile PMI modules
        run: python -m py_compile prediction_markets/*.py
      - name: Run PMI unit tests
        run: python -m unittest discover -s tests -p "test_prediction_markets.py" -v
      - name: Run Supabase persistence tests
        run: python -m unittest discover -s tests -p "test_supabase_store.py" -v
