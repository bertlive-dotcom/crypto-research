name: Trading desk unit tests

on:
  push:
    branches:
      - main
      - feature/ai-crypto-trading-desk-simulation
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install persistence test dependency
        run: python -m pip install requests
      - name: Run simulation engine tests
        run: python -m unittest discover -s tests -v
