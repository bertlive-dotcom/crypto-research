services:
  - type: worker
    name: crypto-research-paper-scanner
    runtime: docker
    dockerfilePath: ./Dockerfile.scanner
    dockerContext: .
    region: frankfurt
    plan: starter
    numInstances: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SCANNER_INTERVAL_SECONDS
        value: "300"
      - key: SCANNER_TOP_UNIVERSE_SIZE
        value: "30"
      - key: SCANNER_MAX_CANDIDATES
        value: "20"
      - key: SCANNER_MIN_QUOTE_VOLUME_USDT
        value: "10000000"
      - key: SCANNER_MIN_SCORE
        value: "65"
      - key: SCANNER_AUTO_ENTRY_SCORE
        value: "80"
      - key: SCANNER_STOP_LOSS_PCT
        value: "3"
      - key: SCANNER_TAKE_PROFIT_PCT
        value: "6"
      - key: SCANNER_MAX_OPEN_POSITIONS
        value: "3"
      - key: SCANNER_MAX_DAILY_LOSS_USDT
        value: "2.4"
      - key: SCANNER_STARTING_CAPITAL_USD
        value: "80"
